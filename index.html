<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fairway — Golf Scorecard</title>
  <meta name="description" content="A minimalist, free golf scorecard and stat tracker." />
  <meta name="theme-color" content="#121314" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Leaflet for Stage 2: mapping and rangefinder -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+e2q6pVb+8H8Jp1pZs2a3tFz8b3KQbT4V0v0s+v4Q=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7k6U2gqQq3xG4r0qjXg6mQpXb3a1m+8fV0b4aM=" crossorigin=""></script>
  <!-- Leaflet.draw for interactive drawing/editing of hole areas -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" integrity="sha512-g2c3f0W+f5yKQZqB9D6QYv7x1u2q2YqO9Zbq0u3mI6sV7e2x1XoVtS6c1Z2q3G5hE4v7m1Y2Z3a4b5c6d7e8A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js" integrity="sha512-zs1Zp3y8G2v4xR3h1i7v6g5B4n1k2m3c4d5e6f7g8h9i0j1k2l3m4n5o6p7q8r9s0t1u2v3w4x5y6z7a8b9c0==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div class="app-shell">
    <!--
      The header's content depends on the screen: the home screen gets the
      wordmark + theme toggle, every other screen gets a back button + title.
      js/header.js fills this in per-route — see js/router.js.
    -->
    <header id="app-header" class="app-header"></header>

    <main id="view-outlet" class="view-outlet" aria-live="polite"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
